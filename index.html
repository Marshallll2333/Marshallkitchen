<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff8ee">
    <title>Lucy的专属小厨房</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <div class="brand">Lucy的专属小厨房</div>
        <div class="tagline">Lucy点菜，Marshall做饭，班德尔厨师以准备就绪。</div>
      </div>
      <nav class="top-tabs" aria-label="主导航">
        <button data-view="customer" class="tab-btn active">顾客点菜</button>
        <button data-view="chef" class="tab-btn">厨师工作台</button>
      </nav>
    </header>

    <main id="app" class="app-shell"></main>

    <div id="toast" class="toast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="config/supabase-config.js"></script>
    <script src="config/email-config.js"></script>
    <script src="data/seed.js"></script>
    <script src="app.js"></script>
  </body>
</html>
